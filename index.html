  - Берете предложенную команду и выполняете ее.
  

  Базовые операции
    git init — создать новый репозиторий
    git clone <url> — склонировать удалённый репозиторий
    git status — текущее состояние файлов
    git add <file> — добавить файл в staging
    git add . — добавить всё
    git commit -m "msg" — зафиксировать изменения

  Работа с историей
    git log — история коммитов

  Ветки
    git branch — список веток
    git branch <name> — создать ветку
    git checkout <name> — переключиться
    git checkout -b <name> — создать и перейти

  Слияние и перенос изменений
    git merge <branch> — влить ветку
    git rebase <branch> — “переписать” историю поверх другой ветки
    git cherry-pick <commit> — взять конкретный коммит

  Работа с удалённым репозиторием
    git remote -v — список remote
    git pull — получить и слить изменения
    git push — отправить изменения
 -->
